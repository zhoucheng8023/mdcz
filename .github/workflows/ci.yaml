name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/ci.yaml"
      - ".github/actions/setup/action.yml"
      - "tests/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "mise.toml"
      - "biome.json"
      - "vitest.config.ts"
      - "tsconfig*.json"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm typecheck

      - run: pnpm exec biome check .

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - run: pnpm test:unit

  integration-contract:
    name: Node/Desktop Integration and Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Node, Desktop, and shared contract integration
        run: pnpm test:integration

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build Desktop and WebUI
        run: pnpm build:desktop && pnpm build:webui


